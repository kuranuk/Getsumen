# ============================================================
#  月面ロボットシミュレータ 設定ファイル
#  座標系(車体): x=前 / y=左 / z=上 (原点=車体中心, 車軸高さ)
#  mount.yaw_deg   : 左向き回転が正 (0=正面, 90=左, 180=後ろ, -90=右)
#  mount.pitch_deg : 上向きが正 (下向きに傾けるなら負)
#  変更後はサーバを再起動してください。
# ============================================================

server:
  host: 0.0.0.0
  port: 8080

simulation:
  physics_hz: 50
  state_hz: 30

# ---------------- 月面 (マイルド) ----------------
world:
  seed: 7                 # 同じseedなら同じ地形
  size: 240.0             # 地形一辺 [m]
  resolution: 0.5         # 高さマップ格子 [m]
  undulation:             # なだらかな起伏
    amplitude: 0.35       # 標準偏差 [m]
    wavelength: 45.0      # 代表波長 [m]
    roughness: 0.04       # 細かい凹凸 [m]
  # --- 月南極(極域ハイランド)の公開統計に基づく (LOLA / LROC / Diviner など) ---
  craters:                # 重なり合った飽和気味のクレータ群 (累積 N(>D)=1.54*sat*D^-2 /m^2)
    diameter_min: 4.0     # [m]
    diameter_max: 80.0    # [m]
    saturation: 0.03      # 幾何学的飽和の割合 (大きいほど密)
    depth_ratio: 0.05     # 平均 深さ/直径 (劣化したクレータを含む。新鮮=0.1以上)
  rocks:                  # 岩: 面積被覆率 k と指数型サイズ分布 (Golombek)
    abundance: 0.02       # k: 典型的な極域は 1-3%。新しいクレータ周辺は高い
    min_diameter: 0.25    # [m]
    max_diameter: 2.0     # [m]
    rim_fraction: 0.35    # クレータ縁に集中配置する割合
    max_count: 2500
  sun:                    # 南極: 太陽は地平線すれすれ (軸傾斜 1.54° のため仰角 0〜約1.5°)
    azimuth_deg: 110.0    # x軸から反時計回り (画面のスライダでも変更可。約29.5日で一周)
    elevation_deg: 1.5    # 影の長さは 高さ/tan(仰角) (20m のHLSで約760m)
    ambient: 0.03         # 地形からの相互反射/地球照 (影の中の明るさ)

# ---------------- HLS (有人着陸機) ----------------
hls:
  x: 0.0
  y: 0.0
  radius: 4.5             # 円筒近似の半径 [m]
  height: 20.0            # ライダーに映る高さ [m]
  pad_radius: 18.0        # 周囲の平坦パッド半径 [m]
  model: cylinder        # cylinder=単純な円柱 (ライダーの当たり判定と同一形状) / detailed=ノーズ・ハッチ付き
  color: "#d8dade"
  hatch_azimuth_deg: 180.0  # 乗降ハッチの向き (detailed のみ描画)
  hatch_height: 4.0

# ---------------- 有人与圧ローバー ----------------
rover:
  start: {x: -55.0, y: -25.0, yaw_deg: 25.0}
  model: box              # box=単純な箱 / detailed=キャビン+6輪
  color: "#e9eaec"
  length: 6.0             # 箱の寸法 [m]
  width: 4.0
  height: 2.4
  clearance: 0.6          # 地面から箱の下面まで [m]
  wheel_radius: 0.6       # 接地面の高さの基準 (車体座標の原点=地面+この値)
  max_speed: 2.0          # [m/s]
  max_yaw_rate_deg: 25.0  # [deg/s]
  accel: 0.6              # [m/s^2]
  yaw_accel_deg: 30.0     # [deg/s^2]
  auto_standoff: 3.0      # 自動アプローチの停止距離 (前端-HLS表面) [m]

# ---------------- センサ ----------------
sensors:
  # カメラ: 前/左/右/後ろ。増減・名称変更は自由 (画面に自動で反映)
  cameras:
    - name: front
      label: 前 (Front)
      grid: {row: 1, col: 2, span: 2}   # 画面の配置 (4列グリッド: 前=中央 / 左右=2段目 / 後ろ=3段目)
      mount: {x: 3.0, y: 0.0, z: 1.3, yaw_deg: 0, pitch_deg: -3}
      fov_deg: 90          # 水平画角
      width: 320
      height: 240
      rate_hz: 2           # レイトレーシングは計算が重いので低め (CPUに応じて上げる)
      render: raytrace     # raytrace=サーバでレイトレーシング / raster=ブラウザCG描画(高速・近似)
      supersample: 1       # 1画素あたり n x n サンプル (2で滑らか・4倍遅い)
      stars: true          # 恒星 (等級ベース。日向に合わせた露出では写らない)
      star_limit_mag: 7.0
      # --- 実機カメラ風の画像特性 (全カメラで省略可。下は既定値) ---
      exposure: auto       # auto = 自動露出 / 数値 = 固定の露出倍率
      ev_bias: 0.0         # 露出補正 [EV]
      auto_exposure_max: 40.0
      read_noise: 0.006    # 読み出しノイズ
      shot_noise: 0.012    # ショットノイズ (暗部ほど目立つ)
      vignette: 0.35       # 周辺減光
      glare: 0.8           # 太陽が写った時のグレア
      blur_px: 0.6         # 光学ボケ [px]
    - name: left
      label: 左 (Left)
      grid: {row: 2, col: 1, span: 2}
      mount: {x: 0.0, y: 2.0, z: 2.0, yaw_deg: 90, pitch_deg: -3}   # 箱の側面 (y=width/2)
      fov_deg: 90
      width: 320
      height: 240
      rate_hz: 2
    - name: right
      label: 右 (Right)
      grid: {row: 2, col: 3, span: 2}
      mount: {x: 0.0, y: -2.0, z: 2.0, yaw_deg: -90, pitch_deg: -3}
      fov_deg: 90
      width: 320
      height: 240
      rate_hz: 2
    # 後ろカメラは2台 (左後ろ・右後ろ。少し外向きに振って死角を減らす)
    - name: rear_left
      label: 後ろ左 (Rear L)
      grid: {row: 3, col: 1, span: 2}
      mount: {x: -3.0, y: 1.0, z: 1.3, yaw_deg: 170, pitch_deg: -3}
      fov_deg: 90
      width: 320
      height: 240
      rate_hz: 2
    - name: rear_right
      label: 後ろ右 (Rear R)
      grid: {row: 3, col: 3, span: 2}
      mount: {x: -3.0, y: -1.0, z: 1.3, yaw_deg: 190, pitch_deg: -3}
      fov_deg: 90
      width: 320
      height: 240
      rate_hz: 2

  # 前面フラッシュライダー (視野内を一括照射 → 距離画像 → 点群)
  lidars:
    - name: front_flash
      label: 前面フラッシュライダー
      mount: {x: 3.0, y: 0.0, z: 0.7, yaw_deg: 0, pitch_deg: -6}
      h_fov_deg: 40
      v_fov_deg: 30
      h_pixels: 128         # 水平画素数
      v_pixels: 96          # 垂直画素数
      min_range: 0.5        # [m]
      max_range: 60.0       # [m]
      rate_hz: 5
      range_noise_std: 0.02 # 距離ノイズ σ [m]
      dropout: 0.01         # 欠測率 0-1
      # 検出限界: max_range は「基準反射率の面に垂直入射」での到達距離。地面すれすれ・暗い面ほど短くなる (0 で無効)
      reference_reflectivity: 0.10
      ground_reflectivity: 0.12   # 月面
      rock_reflectivity: 0.12
      hls_reflectivity: 0.70      # HLS (白色塗装)

ui:
  lidar_view_range: 40.0    # 俯瞰図の初期表示半径 [m] (ホイールで変更可)
  exposure: 2.5             # 右側3Dビューの明るさ (画面のスライダでも変更可)
  view_fill: 0.25           # 3Dビューだけに足す、影の中の地形の補助光 (カメラ画像には影響しない)
  camera_grid_columns: 4    # カメラ画像の配置グリッドの列数 (各カメラの grid: {row, col, span})
