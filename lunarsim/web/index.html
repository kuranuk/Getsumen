<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Rover Sim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="left">
    <section id="lidar-panel">
      <header><span id="lidar-title">LiDAR 点群 (車両上方から)</span><span id="lidar-info"></span></header>
      <canvas id="lidar-canvas"></canvas>
    </section>
    <section id="cams" class="cams"></section>
  </aside>
  <main id="right">
    <div id="view3d"></div>
    <div id="hud">
      <div class="hud-box">
        <div><b>速度</b> <span id="h-v">0.00</span> m/s　<b>旋回</b> <span id="h-w">0.0</span> °/s</div>
        <div><b>HLSまで</b> <span id="h-gap">-</span> m　<b>方位</b> <span id="h-brg">-</span>°</div>
        <div><b>傾斜</b> pitch <span id="h-pitch">0.0</span>° / roll <span id="h-roll">0.0</span>°　<b>走行距離</b> <span id="h-odo">0</span> m</div>
      </div>
      <div class="hud-box controls">
        <button id="b-auto" title="HLSに向けて自動で接近し停止">自動アプローチ</button>
        <button id="b-view" title="視点の切替 (V)">視点: 追従</button>
        <button id="b-reset" title="初期位置へ (R)">リセット</button>
        <label><input type="checkbox" id="c-points" checked> 点群を3D表示</label>
        <span id="conn" class="conn off">接続中…</span>
      </div>
      <div class="hud-box help">
        W/S または ↑/↓: 前進/後退 ・ A/D または ←/→: 左/右旋回 ・ Shift: 低速 ・ Space: 停止<br>
        マウスドラッグ: 視点回転 ・ ホイール: ズーム ・ V: 視点切替 ・ R: リセット
      </div>
    </div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
