<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Rover Sim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="left">
    <section id="lidar-panel">
      <header><span id="lidar-title">LiDAR 点群 (車両上方から)</span><span id="lidar-info"></span></header>
      <canvas id="lidar-canvas"></canvas>
    </section>
    <section id="cams" class="cams"></section>
  </aside>
  <main id="right">
    <div id="view3d"></div>
    <div id="hud">
      <div class="hud-box">
        <div><b>速度</b> <span id="h-v">0.00</span> m/s　<b>旋回</b> <span id="h-w">0.0</span> °/s</div>
        <div><b>HLSまで</b> <span id="h-gap">-</span> m　<b>方位</b> <span id="h-brg">-</span>°</div>
        <div><b>傾斜</b> pitch <span id="h-pitch">0.0</span>° / roll <span id="h-roll">0.0</span>°　<b>走行距離</b> <span id="h-odo">0</span> m</div>
      </div>
      <div class="hud-box controls">
        <button id="b-auto" title="HLSに向けて自動で接近し停止">自動アプローチ</button>
        <button id="b-view" title="視点の切替 (V)">視点: 追従</button>
        <button id="b-reset" title="初期位置へ (R)">リセット</button>
        <label><input type="checkbox" id="c-points" checked> 点群を3D表示</label>
        <label title="カメラ画像に地面距離(カメラ位置からの推定)を表示"><input type="checkbox" id="c-dist" checked> 距離目盛</label>
        <label title="太陽の方位角 (影は約1〜2秒で再計算)">太陽方位 <input type="range" id="sun-az" min="0" max="359" step="1" value="110"><span id="sun-az-v" class="val"></span></label>
        <label title="太陽の仰角 (南極では最大 約1.5°)">仰角 <input type="range" id="sun-el" min="0" max="3" step="0.1" value="1.5"><span id="sun-el-v" class="val"></span></label>
        <span id="conn" class="conn off">接続中…</span>
      </div>
      <div class="hud-box help">
        W/S または ↑/↓: 前進/後退 ・ A/D または ←/→: 左/右旋回 ・ Shift: 低速 ・ Space: 停止(自動も解除)<br>
        マウスドラッグ: 視点回転 ・ ホイール: ズーム ・ V: 視点切替 ・ R: リセット
      </div>
    </div>
    <div id="pad" class="hud-box" title="キーボード: W/A/S/D または矢印キー ・ ここを押し続けても走行できます">
      <div class="pad-grid">
        <span></span><button data-act="fwd">▲<small>W</small></button><span></span>
        <button data-act="left">◀<small>A</small></button><button data-act="back">▼<small>S</small></button><button data-act="right">▶<small>D</small></button>
      </div>
      <label><input type="checkbox" id="pad-slow"> 低速 (Shift)</label>
    </div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
